{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<div class="login">
  <form method="post" class="panel">
    <div class="brand dark"><span class="leaf"></span>GreenLeaf<small>Grocers</small></div>
    {% if fatal %}<div class="flash error">Something went wrong on our side. Try again.</div>{% endif %}
    <h1>Sign in</h1>
    <label>Username<input name="username" autocomplete="username" required autofocus></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn">Sign in</button>
    <p class="hint">Demo: admin / admin123 &nbsp; cashier / cashier123</p>
  </form>
</div>
{% endblock %}
